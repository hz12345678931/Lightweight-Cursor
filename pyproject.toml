[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pypilot-desktop"
version = "0.1.0"
description = "A small Python-first desktop coding agent"
requires-python = ">=3.11"
dependencies = ["fastapi==0.162.2", "uvicorn==0.54.0", "httpx==0.28.1", "pywebview==6.2.1", "mcp==1.30.0", "pillow==13.0.0", "jsonschema==4.26.0", "pywin32==312; sys_platform == 'win32'"]

[project.scripts]
pypilot = "pypilot.app:main"

[tool.setuptools.packages.find]
include = ["pypilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

